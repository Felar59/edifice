# Édifice — le musée impossible, servi par l'adresse de la machine.
#
# Le nom 164-132-99-194.sslip.io N'EST PAS un domaine de plus : sslip.io est un
# DNS public qui renvoie l'IP contenue dans le nom. C'est donc bien « le site
# par l'IP » — mais avec un vrai nom, donc un vrai certificat, donc HTTPS.
# Ce détour n'est pas cosmétique : le musée dessine en WebGPU, et le navigateur
# ne donne `navigator.gpu` qu'aux contextes sécurisés. En HTTP nu sur l'IP, le
# bâtiment resterait porte close.
#
# Le nom appartenait à picturetodmc, comme échafaudage d'avant son vrai
# domaine ; il n'y servait plus qu'une redirection. Il est repris ici, et les
# certificats qui le portent en SAN continuent de se renouveler par le webroot
# ci-dessous — peu importe quel bloc répond au défi, pourvu que quelqu'un le
# serve.
#
# `default_server` : c'est ce bloc qui répond quand on tape l'adresse nue
# http://164.132.99.194 — auparavant, ces requêtes tombaient sur emoji-art par
# le simple hasard de l'ordre alphabétique des fichiers.

# 1) http -> https, et le défi ACME qui renouvelle les certificats.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 164-132-99-194.sslip.io 164.132.99.194;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/scan-shield.conf;

    location / {
        return 301 https://164-132-99-194.sslip.io$request_uri;
    }
}

# 2) Le musée.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 164-132-99-194.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/164-132-99-194.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/164-132-99-194.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Pas de HSTS, à dessein : ce nom est l'échafaudage du portfolio, pas son
    # adresse définitive. Épingler les navigateurs sur un nom qu'on remplacera
    # par un domaine coûte plus qu'il ne protège.

    root /var/www/edifice/dist;
    index index.html;

    access_log /var/log/nginx/edifice.access.log;
    error_log  /var/log/nginx/edifice.error.log;

    include /etc/nginx/snippets/scan-shield.conf;

    # Le musée pèse : 2 Mo de wasm, 14 Mo de données du jeu. Sans compression,
    # la borne mettrait un souffle à se charger. (Le .data est déjà dense — des
    # PNG et de l'OGG — gzip n'y gagnerait rien et on l'exclut par précision.)
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;
    gzip_min_length 1024;

    # Les fichiers de Vite portent leur empreinte dans leur nom : un an de
    # cache, immuable — un contenu qui change change de nom.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Le jeu de la borne n'est pas empreint : une heure, revalidée par etag.
    # Assez long pour qu'une visite ne le recharge pas, assez court pour qu'un
    # nouveau déploiement se voie dans l'heure.
    location /machines/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # La page elle-même se revalide à chaque visite : c'est elle qui nomme les
    # empreintes, elle doit toujours être fraîche.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
