<!doctype html>
<meta charset="utf-8">
<title>Wolf3D — dans le navigateur</title>
<style>
  body { margin: 0; background: #101012; display: grid; place-items: center; height: 100vh; }
  /* C'est la page qui fixe la définition du jeu : le portage lit la taille CSS
     du canevas et s'y installe. */
  canvas { border: 0; display: block; width: 100vw; height: 100vh; }
  #log { display: none; }
</style>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="log"></div>
<script>
  window.addEventListener('error', (e) => { window.__err = String(e.message) })
  // Page d'essai, hors du musée : elle sert à voir tourner le jeu tout seul
  // avant de l'accrocher au mur de la grande salle.
  const log = document.getElementById('log')
  const say = (s) => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight }
  var Module = {
    canvas: document.getElementById('canvas'),
    print: say,
    printErr: say,
    onRuntimeInitialized: () => {
      say('— module chargé —')
      // On appelle `main` nous-mêmes, avec ses **trois** arguments. Emscripten
      // n'en passe que deux, et le jeu lit le troisième — l'environnement — dès
      // sa première ligne pour vérifier qu'il y a un écran.
      const name = 'wolf3d'
      const bytes = Module.lengthBytesUTF8(name) + 1
      const str = Module._malloc(bytes)
      Module.stringToUTF8(name, str, bytes)
      const argv = Module._malloc(8)
      // `setValue` plutôt que HEAPU32 : la mémoire peut grandir, et les vues
      // typées sont alors remplacées. Emscripten n'expose pas les anciennes.
      Module.setValue(argv, str, 'i32')
      Module.setValue(argv + 4, 0, 'i32')
      say('— lancement du jeu —')
      Module._main(1, argv, Module._edifice_environ())
    },
    onAbort: (w) => say('ABANDON : ' + w),
    onExit: (c) => say('sortie du programme, code ' + c),
  }
</script>
<script src="wolf3d.js"></script>
